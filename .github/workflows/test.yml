name: Complete Test Suite CI/CD

on: # Defining triggers
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: # Setting up the JOB
  build-and-test:
    runs-on: ubuntu-latest

    steps: # Running Test with Build Tool
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html pytest-xdist flask

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Chrome Script
        run: python basic-scripts/chrome.py

      - name: Run Brave Script
        run: python basic-scripts/brave.py

      - name: Run Choose Script
        run: python basic-scripts/choose.py

      - name: Run Search Script
        run: python basic-scripts/search.py
        continue-on-error: true

      - name: Run Python Tests - Manual
        run: python python-tests/test_search_manual.py
        continue-on-error: true

      - name: Run Python Tests - Pytest
        run: pytest python-tests/test_search_pytest.py -v --html=python-tests/test-report.html --self-contained-html
        continue-on-error: true

      - name: Start Flask App
        run: |
          cd functional-testing
          python demo_app.py &
          sleep 5

      - name: Run Functional Tests - Smoke
        run: |
          cd functional-testing
          pytest test_demo_app.py -v -m smoke --html=smoke_test_report.html --self-contained-html

      - name: Run Functional Tests - Regression
        run: |
          cd functional-testing
          pytest test_demo_app.py -v -m regression --html=regression_test_report.html --self-contained-html
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            python-tests/test-report.html
            functional-testing/smoke_test_report.html
            functional-testing/regression_test_report.html
