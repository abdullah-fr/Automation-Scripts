[pytest]
# Playwright-specific configuration
addopts =
    --headed
    --slowmo=1000
    --browser=chromium

# --headed: Show browser window
# --slowmo: Slow down operations by 1000ms (1 second) so you can see what's happening
# --browser: Use chromium (can also use firefox or webkit)

# To use this config:
# pytest -c playwright.ini test_search_playwright.py -v
